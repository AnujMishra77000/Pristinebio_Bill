# Include INSIDE the existing HTTPS server block for www.pristinebiopharma.in.
# Keep its certificates and existing location / unchanged.
# These ports match deploy/.env.example; update both if the VPS uses other ports.

location = /bill {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
}

# Strip /bill only for backend requests. FastAPI keeps its /api/v1 routes.
location ^~ /bill/api/v1/ {
    proxy_pass http://127.0.0.1:8000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 10m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    # Retain /bill on backend canonical/slash redirects without changing
    # the Path=/ cookies required by the application's __Host- cookies.
    proxy_redirect ~^https?://[^/]+(/api/v1(?:/.*)?)$ /bill$1;
    proxy_redirect /api/v1/ /bill/api/v1/;
}

# Preserve /bill for Next.js pages, assets and client navigation.
location ^~ /bill/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_cache off;
}

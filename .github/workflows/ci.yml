name: quality-gates

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: billing_security_test
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing_security_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://billing:ci-only-password@localhost:5432/billing_security_test
      TEST_SECURITY_DATABASE_URL: postgresql+psycopg://billing:ci-only-password@localhost:5432/billing_security_test
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET_KEY: ci-only-signing-secret
      MFA_ENCRYPTION_KEY: piIBkqKguj-fBfrIMXyXF79KhEOIlNiCZxbPn9l_sjA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements.lock
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
      - name: Python dependency audit
        run: |
          python -m pip install --no-cache-dir pip-audit
          pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://billing.example.com/api/v1
      - name: npm dependency audit
        run: |
          set +e
          npm audit --audit-level=high --json > /tmp/npm-audit.json
          audit_status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const findings = Object.values(report.vulnerabilities || {});
          const unexpected = findings.filter((finding) =>
            !['next', 'postcss'].includes(finding.name) && ['high', 'critical'].includes(finding.severity)
          );
          if ((report.metadata?.vulnerabilities?.critical || 0) > 0 || unexpected.length) {
            console.error('Unexpected high/critical npm advisory:', unexpected);
            process.exit(1);
          }
          console.warn('Known supported-line advisory review: Next.js 15.5.24 bundles PostCSS 8.4.31; npm reports a fix only through Next.js 16, which is a major upgrade. See docs/OPERATIONS_RUNBOOK.md.');
          NODE

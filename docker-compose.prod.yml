services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set the public API URL before building}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    environment:
      APP_ENVIRONMENT: production
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL:?Set the private PostgreSQL DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set the private Redis URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the HTTPS frontend origin}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a strong signing secret}
      COOKIE_SECURE: "true"
      PDF_STORAGE_DIR: /app/storage/invoices
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
    volumes:
      - pdf_storage:/app/storage/invoices
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    networks: [app, data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a non-default POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

volumes:
  pdf_storage:
  postgres_data:
  redis_data:

networks:
  app:
  data:
    internal: true
